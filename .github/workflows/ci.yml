# =============================================================================
# CI - runs on every pull request and on pushes to main.
#
# Path filters (dorny/paths-filter) mean a frontend-only change does not spin
# up Python and Postgres, and a docs-only change runs nothing but the final
# gate. The `ci-passed` job at the bottom is what branch protection should
# require: it stays green when a job is legitimately skipped, but red if any
# job that did run failed.
# =============================================================================

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Superseded runs on the same branch are pointless; cancel them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only. CI never needs cloud credentials: no OIDC, no deploys.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Work out what actually changed, so the jobs below can skip themselves.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'apps/frontend/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'apps/backend/**'
              - '.github/workflows/ci.yml'
            terraform:
              - 'infra/terraform/**'
              - '.github/workflows/ci.yml'

  # ---------------------------------------------------------------------------
  # Frontend: types, lint, formatting, production build.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      # `npm ci` (not `npm install`) so the lockfile is authoritative and the
      # build fails if it is out of date.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Catches errors that only appear at build time, such as a Server
      # Component importing browser-only code.
      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Backend: lint, format, types, tests.
  #
  # The matrix covers the Python version used in the Docker image (3.12) and
  # the minimum supported version (3.11), so a 3.12-only syntax slip is caught
  # before it reaches anyone still on 3.11.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (py${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: apps/backend

    # A real Postgres, so the database-backed tests actually run in CI
    # instead of silently skipping.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      # Advisory: type coverage is being improved incrementally, so a failure
      # here reports without blocking the merge.
      - name: Typecheck
        run: mypy app
        continue-on-error: true

      - name: Test
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/app
        run: pytest -v

  # ---------------------------------------------------------------------------
  # Terraform: formatting and validation for every stack.
  #
  # `validate` needs `init`, and `init -backend=false` skips remote state so
  # no cloud credentials are required - CI stays credential-free.
  # ---------------------------------------------------------------------------
  terraform:
    name: Terraform (${{ matrix.stack }})
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - bootstrap
          - environments/dev
          - environments/prod
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          # The wrapper rewrites stdout, which makes raw output harder to use.
          terraform_wrapper: false

      # Checked once across the whole tree, including the modules, rather
      # than once per matrix leg.
      - name: Check formatting
        if: matrix.stack == 'bootstrap'
        run: terraform fmt -check -recursive -diff
        working-directory: infra/terraform

      - name: Init (no backend)
        run: terraform init -backend=false -input=false
        working-directory: infra/terraform/${{ matrix.stack }}

      - name: Validate
        run: terraform validate -no-color
        working-directory: infra/terraform/${{ matrix.stack }}

  # ---------------------------------------------------------------------------
  # Single required status check for branch protection.
  #
  # `always()` makes this run even when upstream jobs are skipped; the
  # explicit result check then fails only on real failures or cancellations.
  # Without this pattern, requiring the individual jobs would block any PR
  # that legitimately skips one.
  # ---------------------------------------------------------------------------
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, frontend, backend, terraform]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no job failed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Upstream job results: $results"
          for result in $results; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::A required CI job did not pass."
              exit 1
            fi
          done
          echo "All CI jobs passed or were skipped."
