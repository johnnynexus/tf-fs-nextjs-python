[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the tf-fs-nextjs-python reference monorepo"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Database. asyncpg is the async Postgres driver used by SQLAlchemy's async engine.
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only the `app` package is shipped; `tests/` stays out of the built image.
packages = ["app"]

# ----------------------------------------------------------------------------
# Ruff: linter + formatter. Replaces flake8/isort/black with one fast tool.
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
]
# B008 fires on FastAPI's `Depends()` in defaults, which is the documented idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

# ----------------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Lets async test functions run without decorating every one of them.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "database: test requires a live Postgres database (skipped when DATABASE_URL is unset)",
]

# ----------------------------------------------------------------------------
# mypy (advisory; CI runs it non-blocking)
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
plugins = []
ignore_missing_imports = true
warn_unused_ignores = true
